version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Dev tooling is bumped together in one weekly PR; the library has no runtime dependencies.
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
    ignore:
      # Pinned to the Chromium build preinstalled in the dev container and to the CI container image
      # (mcr.microsoft.com/playwright:v<version>-noble in ci.yml); bump all three together.
      - dependency-name: '@playwright/test'
      # vitest 3 needs a matching @vitest/coverage-v8 and config review.
      - dependency-name: 'vitest'
        update-types: [version-update:semver-major]
      - dependency-name: '@vitest/coverage-v8'
        update-types: [version-update:semver-major]
