# Visual regression baselines (e2e/visual.spec.ts-snapshots) are generated in the same Playwright
# container image CI compares them in, then committed to main. Run it from Actions after an
# intentional visual change: Actions → Update visual snapshots → Run workflow.
name: Update visual snapshots

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-snapshots
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Keep in sync with the e2e job in ci.yml.
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
      options: --user 1001
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright test e2e/visual.spec.ts --project=chromium --update-snapshots=all
        env:
          VISUAL: '1'
      - name: Verify the new baselines
        run: npx playwright test e2e/visual.spec.ts --project=chromium
        env:
          VISUAL: '1'
      - name: Commit to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add e2e/visual.spec.ts-snapshots
          if git diff --cached --quiet; then
            echo "Baselines are already up to date."
            exit 0
          fi
          git commit -m "test: update visual snapshots"
          git push origin HEAD:main
