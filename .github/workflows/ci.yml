name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, test, build (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run build
      - run: npm run size
      - run: npm run lint:pkg
      - name: Upload coverage
        if: matrix.node == 22
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage
          retention-days: 7

  e2e:
    name: E2E (Chromium, Firefox, WebKit)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Tarayıcılar ve sistem bağımlılıkları imajda hazır: `playwright install --with-deps` adımındaki apt
    # indirmesi runner'da zaman zaman takılıyordu. Etiket @playwright/test sürümüyle aynı olmalı.
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
      options: --user 1001
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:e2e
        env:
          # Görsel referanslar bu imajda üretilir; yalnızca burada karşılaştırılır.
          VISUAL: '1'
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  react18:
    name: React 18 compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The repo develops against React 19; the wrapper supports React >= 18.
      - run: npm install --no-save react@18 react-dom@18
      - run: npx vitest run tests/react.test.ts

  astro:
    name: Astro example
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm pack --pack-destination examples/astro
      - name: Build the example with the packed tarball
        working-directory: examples/astro
        run: |
          npm ci
          npm install --no-save ./daktilo-js-*.tgz
          npm run build
      - run: node scripts/check-astro.mjs
